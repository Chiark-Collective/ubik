# ABOUTME: Backend package configuration for sdf-labeler API
# ABOUTME: FastAPI service for SDF training data labeling

[project]
name = "sdf-labeler-api"
version = "0.1.0"
description = "Backend API for interactive SDF training data generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "trimesh>=4.0.0",
    "laspy[laszip]>=2.5.0",
    "pyarrow>=14.0.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.0",
    # Scenario datasets
    "surface-scenarios[mesh]>=0.3.0",
    "trenchfoot>=0.4.0",
    "networkx>=3.6.1",
    "alphashape>=1.3.1",
    "pyyaml>=6.0",
    "plotly>=5.18.0",
]

[project.scripts]
sdf-labeler = "sdf_labeler_api.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdf_labeler_api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "E402",   # Module level import not at top (acceptable after logging setup)
    "E741",   # Ambiguous variable name (context makes it clear)
    "B008",   # Function call in argument defaults (standard FastAPI pattern)
    "B904",   # raise-without-from-inside-except (intentional for HTTPException)
    "B905",   # zip() without strict= (not required for same-length iterables)
    "C408",   # Unnecessary dict() call (idiomatic Plotly style)
    "SIM102", # Nested if (sometimes clearer than combined conditions)
    "SIM108", # Ternary operator (sometimes clearer as if/else)
]

[tool.ruff.lint.isort]
known-first-party = ["sdf_labeler_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.1.0",
]
